<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>auth | dhanur.me</title>
    <link rel="icon" type="image/x-icon" href="https://dhanur.me/favicon.ico" />

    <!-- Trusted Types default policy (must run before ANY script that uses innerHTML/script.src) -->
    <script>
      (function () {
        if (window.trustedTypes && window.trustedTypes.createPolicy) {
          try {
            window.__defaultPolicy = window.trustedTypes.createPolicy(
              "default",
              {
                createScriptURL: function (s) {
                  return s;
                },
                createHTML: function (s) {
                  return s;
                },
              },
            );
          } catch (e) {}
        }
        function installFramePolicy(m) {
          var orig = Element.prototype[m];
          Element.prototype[m] = function () {
            var r = orig.apply(this, arguments);
            var n = arguments[0];
            if (n && n.tagName === "IFRAME") {
              try {
                var w = n.contentWindow;
                if (w && w.trustedTypes && !w.trustedTypes.defaultPolicy) {
                  w.trustedTypes.createPolicy("default", {
                    createHTML: function (s) {
                      return s;
                    },
                    createScript: function (s) {
                      return s;
                    },
                    createScriptURL: function (s) {
                      return s;
                    },
                  });
                }
              } catch (e) {}
            }
            return r;
          };
        }
        installFramePolicy("appendChild");
        installFramePolicy("insertBefore");
      })();
    </script>

    <script src="popup-nav-config.js"></script>
    <link rel="stylesheet" href="https://dhanur.me/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://dhanur.me/css/dui.css" />
    <script src="https://dhanur.me/js/shell.min.js" defer></script>
  </head>
    <body class="bg-base-100 text-base-content antialiased min-h-screen">
    <header id="dhanur-shell"></header>

    <main
      id="app"
      class="eco-page eco-container eco-container-auth flex items-center justify-center min-h-[60vh]"
    >
      <div class="flex flex-col items-center gap-4" id="stateLoading">
        <span class="loading loading-spinner loading-md"></span>
        <p class="text-sm font-semibold text-base-content/85 text-center">
          Completing sign-in process...
        </p>
      </div>
      <div
        class="flex flex-col items-center gap-4 hidden w-full"
        id="stateError"
      >
        <div
          class="alert alert-error md:max-w-sm w-full flex-col items-center text-center gap-2"
        >
          <i class="fa-solid fa-circle-xmark text-xl"></i>
          <div>
            <h3 class="font-bold">Authentication failed</h3>
            <p class="text-sm">There was an issue processing your login.</p>
          </div>
          <p class="text-xs opacity-70">
            Closing in <span id="closeCountdown">3</span>s
          </p>
          <button class="btn btn-sm btn-primary" id="btnClose">
            Close Window
          </button>
        </div>
      </div>
    </main>

    <script src="popup-handler.js"></script>
  </body>
</html>
